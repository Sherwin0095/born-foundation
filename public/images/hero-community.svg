<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F493B"/>
      <stop offset="100%" stop-color="#285746"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6A565"/>
      <stop offset="100%" stop-color="#FAF8F2"/>
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD785B"/>
      <stop offset="100%" stop-color="#cb8d73"/>
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DCE8DD"/>
      <stop offset="100%" stop-color="#c2d6c4"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" rx="32" fill="url(#bgGrad)"/>

  <!-- Soft Ambient Circles -->
  <circle cx="700" cy="120" r="180" fill="#C6A565" opacity="0.15"/>
  <circle cx="100" cy="500" r="220" fill="#DCE8DD" opacity="0.1"/>

  <!-- Sun of Hope -->
  <circle cx="400" cy="180" r="80" fill="url(#sunGrad)" opacity="0.9"/>
  <circle cx="400" cy="180" r="105" stroke="#C6A565" stroke-width="2" stroke-dasharray="6 8" opacity="0.5"/>

  <!-- Rolling Community Hills & Landscapes -->
  <path d="M0 450 C 200 380, 450 480, 800 400 L 800 600 L 0 600 Z" fill="#DCE8DD" opacity="0.25"/>
  <path d="M0 490 C 280 430, 520 520, 800 460 L 800 600 L 0 600 Z" fill="#FAF8F2" opacity="0.95"/>

  <!-- Learning Tree of Development (Left) -->
  <path d="M120 490 Q 130 360 170 320" stroke="#BD785B" stroke-width="14" stroke-linecap="round"/>
  <circle cx="170" cy="270" r="60" fill="#285746"/>
  <circle cx="210" cy="285" r="45" fill="#35725c"/>
  <circle cx="140" cy="290" r="45" fill="#1F493B"/>

  <!-- Center-Right: Group Learning Scene -->
  <!-- Table / Bench -->
  <rect x="300" y="440" width="360" height="18" rx="8" fill="#BD785B"/>
  <rect x="340" y="458" width="14" height="60" rx="4" fill="#a26045"/>
  <rect x="610" y="458" width="14" height="60" rx="4" fill="#a26045"/>

  <!-- Books and Learning Tools on Table -->
  <!-- Open Book -->
  <path d="M440 438 Q 470 432 490 438 L 490 422 Q 470 416 440 422 Z" fill="#FAF8F2" stroke="#285746" stroke-width="2"/>
  <path d="M540 438 Q 510 432 490 438 L 490 422 Q 510 416 540 422 Z" fill="#FAF8F2" stroke="#285746" stroke-width="2"/>
  <!-- Stack of Books -->
  <rect x="360" y="424" width="45" height="7" rx="2" fill="#C6A565"/>
  <rect x="358" y="431" width="48" height="8" rx="2" fill="#BD785B"/>

  <!-- Child Learner 1 (Reading intently) -->
  <circle cx="370" cy="350" r="24" fill="#FAF8F2"/>
  <path d="M352 344 Q 370 332 388 344 Q 370 348 352 344 Z" fill="#26342D"/>
  <path d="M346 380 C 346 368, 394 368, 394 380 L 398 440 L 342 440 Z" fill="#285746"/>
  <!-- Arms resting on table -->
  <path d="M346 390 Q 365 424 400 428" stroke="#FAF8F2" stroke-width="9" stroke-linecap="round"/>

  <!-- Child Learner 2 (Raising hand in joy/learning) -->
  <circle cx="490" cy="335" r="24" fill="#FAF8F2"/>
  <path d="M472 328 Q 490 316 508 328 Q 490 334 472 328 Z" fill="#BD785B"/>
  <path d="M466 365 C 466 355, 514 355, 514 365 L 518 440 L 462 440 Z" fill="#C6A565"/>
  <!-- Raised Arm -->
  <path d="M510 370 Q 532 330 538 300" stroke="#FAF8F2" stroke-width="9" stroke-linecap="round"/>

  <!-- Mentor / Caregiver (Guiding with kindness) -->
  <circle cx="610" cy="310" r="28" fill="#FAF8F2"/>
  <path d="M588 302 Q 610 286 632 302 Q 610 308 588 302 Z" fill="#26342D"/>
  <path d="M582 345 C 582 332, 638 332, 638 345 L 642 480 L 578 480 Z" fill="#BD785B"/>
  <!-- Guiding hand towards book -->
  <path d="M590 365 Q 560 395 500 415" stroke="#FAF8F2" stroke-width="10" stroke-linecap="round"/>

  <!-- Floating Trust Badge: Verified Safe Space -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="58" width="240" height="64" rx="16" fill="#FFFFFF"/>
    <circle cx="72" cy="90" r="18" fill="#DCE8DD"/>
    <path d="M66 90 L 71 95 L 79 85" stroke="#285746" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="84" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#285746" letter-spacing="0.5">CHILD SAFEGUARDED</text>
    <text x="100" y="102" font-family="'Inter', sans-serif" font-size="11" fill="#657169">Verified Nurturing Centers</text>
  </g>

  <!-- Floating Stats Badge: Community Care -->
  <g filter="url(#cardShadow)">
    <rect x="520" y="470" width="230" height="72" rx="16" fill="#FFFFFF"/>
    <circle cx="554" cy="506" r="18" fill="#FAF8F2"/>
    <path d="M547 506 C 547 500, 561 500, 561 506 C 561 513, 554 517, 554 517 C 554 517, 547 513, 547 506 Z" fill="#BD785B"/>
    <text x="584" y="499" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#26342D">HOLISTIC CARE</text>
    <text x="584" y="517" font-family="'Inter', sans-serif" font-size="11" fill="#657169">Nutrition • Education • Safety</text>
  </g>
</svg>
